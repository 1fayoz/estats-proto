// Xabar yuborish — bot bajaradi.
//
// Kimga yuborish `identity.NotifyTargets` dan olinadi. Bot faqat
// yetkazadi: shu bo'linish tufayli bot holatsiz qoladi va uni
// istalgan vaqtda qayta ishga tushirish mumkin.

syntax = "proto3";

package estats.notifier.v1;

option go_package = "github.com/estats/proto/gen/notifier/v1;notifierv1";

service Notifier {
  rpc SendOrderEvent(OrderEvent) returns (SendResult);
  rpc SendModerationEvent(ModerationEvent) returns (SendResult);
  rpc SendNotice(Notice) returns (SendResult);
}

message OrderEvent {
  int64 chat_id = 1;
  int64 shop_id = 2;
  string shop_name = 3;
  string marketplace = 4;

  string order_id = 5;
  string item_id = 6;
  string product_title = 7;
  string sku_code = 8;
  string product_url = 9;

  int32 quantity = 10;
  string price = 11;          // formatlangan, valyutasi bilan
  string payout = 12;

  Kind kind = 13;
  string status = 14;
  string cancel_reason = 15;
  string happened_at = 16;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    NEW = 1;
    STATUS_CHANGED = 2;
    CANCELED = 3;
    RETURNED = 4;
  }
}

message ModerationEvent {
  int64 chat_id = 1;
  int64 shop_id = 2;
  string shop_name = 3;
  string marketplace = 4;

  string product_title = 5;
  string sku_code = 6;
  string product_url = 7;

  Kind kind = 8;
  repeated string reasons = 9;
  string happened_at = 10;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    PENDING = 1;
    APPROVED = 2;
    REJECTED = 3;
  }
}

message Notice {
  int64 chat_id = 1;
  string text = 2;
  bool silent = 3;
}

message SendResult {
  bool delivered = 1;
  // `blocked` — odam botni bloklagan. Chaqiruvchi buni yozib
  // qo'yadi va keyingi safar urinmaydi.
  string error = 2;
}
