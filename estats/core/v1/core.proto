// Yadro (`my-stats-back`) — sotuvchining O'Z do'koni haqidagi bilim.
//
// Bajaradi: `my-stats-back`. Chaqiradi: `estats-lens`.
//
// Bozor (`estats-market`) raqobatchining tushumini biladi, lekin hech
// kimning TANNARXINI bilmaydi. Tannarx faqat yadroda: sotuvchi kirim
// kiritadi va FIFO uni sotuvlarga taqsimlaydi. Kengaytma sotuvchining
// o'z tovari sahifasida "unit iqtisodiyoti"ni taxminiy tannarx bilan
// emas, HAQIQIY tannarx bilan hisoblashi uchun shu shartnoma kerak.
//
// Pul — so'm, butun son. `optional` — noma'lum (nol emas).

syntax = "proto3";

package estats.core.v1;

option go_package = "github.com/estats/proto/gen/core/v1;corev1";

service Core {
  // Foydalanuvchi ko'ra oladigan do'konlardagi shu Uzum tovarlari.
  // Tovar foydalanuvchiga tegishli bo'lmasa — ro'yxatda YO'Q (xato emas).
  rpc GetOwnProducts(OwnProductsRequest) returns (OwnProducts);

  // Rasmdan qidiruv so'rovlari: "bu nima va Uzum'da qanday izlanadi".
  // AI sarfi yadroning yagona hisobiga (`ai_usage`) yoziladi — kalit
  // ham, sarf ham bitta joyda.
  rpc DescribeImage(DescribeImageRequest) returns (ImageDescription);

  // Foydalanuvchi ko'ra oladigan do'konlardagi shu tovarlarning SOTUVI
  // ixtiyoriy davr uchun (sotuvchi kabinetidagi reklama samaradorligi:
  // reklama xarajati kartochkaning BUTUN sotuviga nisbatan). Pul maydonlari
  // faqat `pnl.view` bilan.
  rpc GetOwnSales(OwnSalesRequest) returns (OwnSales);

  // Uzum qidiruvidagi o'rinlar — reklama belgisi bilan, jonli. Qidiruv
  // tokeni va o'rin hisoblash qoidasi yadroda (SEO «Qidiruvdagi o'rin»
  // bilan bir xil): ikkinchi nusxa yozilmaydi.
  rpc SearchPositions(SearchPositionsRequest) returns (SearchPositionsResult);
}

message OwnProductsRequest {
  int64 user_id = 1;
  repeated int64 uzum_product_ids = 2;
}

message OwnSku {
  // Uzum SKU id'si.
  int64 sku_id = 1;
  string title = 2;
  // FIFO o'rtacha tannarx — ruxsat bo'lsagina (`pnl.view`).
  optional int64 average_cost = 3;
  optional int64 last_cost = 4;
  int64 stock = 5;
  optional int64 price = 6;
}

message OwnProduct {
  int64 uzum_product_id = 1;
  // eStats ichki do'kon id'si.
  int64 shop_id = 2;
  string shop_name = 3;
  repeated OwnSku skus = 4;
  // SKU tannarxlarining qoldiq bo'yicha o'rtachasi.
  optional int64 average_cost = 5;
  int64 stock = 6;
  optional int64 sold_30 = 7;
  optional int64 revenue_30 = 8;
  // Uzum 30 kunda to'lagan (sotuvchi foydasi) — ruxsat bo'lsagina.
  optional int64 payout_30 = 9;
  // 1 − to'lov / tushum: komissiya + logistika HAQIQATDA qancha
  // ushlangani. Ruxsat bo'lsagina.
  optional double effective_fee_rate = 10;
  // Tannarx ko'rinadimi (`pnl.view`). `false` bo'lsa pul maydonlari bo'sh.
  bool money_visible = 11;
  string warehouse_url = 12;
}

message OwnProducts {
  repeated OwnProduct products = 1;
}

message DescribeImageRequest {
  int64 user_id = 1;
  bytes image = 2;
  // image/png | image/jpeg | image/webp
  string mime = 3;
  // uz | ru — tavsif tili.
  string language = 4;
}

message ImageDescription {
  bool ok = 1;
  string error = 2;
  // Qisqa nomi: "silikon telefon g'ilofi".
  string product = 3;
  repeated string queries_uz = 4;
  repeated string queries_ru = 5;
  repeated string colors = 6;
  string category_hint = 7;
}

message OwnSalesRequest {
  int64 user_id = 1;
  repeated int64 uzum_product_ids = 2;
  // YYYY-MM-DD, Toshkent vaqti, ikkalasi ham kiradi.
  string date_from = 3;
  string date_to = 4;
}

message OwnSalesItem {
  int64 uzum_product_id = 1;
  int64 shop_id = 2;
  string shop_name = 3;
  // Uzum do'kon id'si (sotuvchi kabinetidagi `shopId`).
  int64 uzum_shop_id = 4;
  string title = 5;
  // Sotilgan (va yetkazilayotgan) donalar, qaytarilganlarsiz.
  int64 units = 6;
  // Xaridor to'lagani (brutto).
  int64 revenue = 7;
  // Uzum to'lovi (sotuvchi foydasi) — `pnl.view` bo'lsagina.
  optional int64 payout = 8;
  // Sotilgan donalar bo'yicha o'rtacha FIFO tannarx — `pnl.view` bo'lsagina.
  optional int64 average_cost = 9;
  bool money_visible = 10;
  string warehouse_url = 11;
}

message OwnSales {
  repeated OwnSalesItem items = 1;
  string date_from = 2;
  string date_to = 3;
}

message SearchPositionsRequest {
  // 60 tagacha so'rov; har biri ko'pi bilan 100 chuqurlikda.
  repeated string queries = 1;
  repeated int64 product_ids = 2;
}

message QueryPosition {
  string query = 1;
  int64 product_id = 2;
  // O'lchandi-yu topilmadi — maydon yo'q; `measured=false` — o'lchanmadi.
  optional int32 position = 3;
  optional int32 organic = 4;
  bool is_ad = 5;
  bool measured = 6;
}

message SearchPositionsResult {
  repeated QueryPosition positions = 1;
  // Bozor tokeni muddati o'tgan va h.k. — xato matni (bo'sh — hammasi o'lchandi).
  string error = 2;
}
